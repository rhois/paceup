name: paceup
description: "PaceUp — pelacak lari & aktivitas outdoor (Strava-like): deteksi GPS, pace, split, elevasi, feed sosial, kudos, komentar, leaderboard."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Backend (Postgres + Auth + Storage + Realtime)
  supabase_flutter: ^2.8.4

  # GPS
  geolocator: ^13.0.2

  # Tipe koordinat untuk peta rute
  latlong2: ^0.9.1

  # Local storage / offline mode
  shared_preferences: ^2.3.3

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
