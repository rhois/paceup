name: Web (GitHub Pages)

# Membangun versi web dan menerbitkannya ke GitHub Pages.
#
# Ini cara paling cepat mencoba aplikasi di ponsel TANPA memasang apa pun:
# buka tautan Pages di browser ponsel, lalu login dengan akun demo.
#
# PENTING: GitHub Pages pada repositori PRIVAT memerlukan paket GitHub Pro.
# Untuk repo privat, job `deploy` akan gagal — job `build` tetap berjalan
# dan artifact-nya bisa diunduh. Agar Pages aktif, ubah visibilitas repo
# menjadi publik:  Settings -> General -> Danger Zone -> Change visibility.
#
# GPS di browser hanya bekerja pada HTTPS (Pages sudah HTTPS), dan browser
# meminta izin lokasi saat tombol MULAI LARI ditekan.

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build web
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ambil dependensi
        run: flutter pub get

      - name: Build web
        run: |
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}

      # Coba aktifkan Pages otomatis. Bila gagal (butuh hak admin),
      # jangan hentikan job: artifact web tetap diunggah di bawah.
      - name: Konfigurasi Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Unggah artifact web (selalu tersedia)
        uses: actions/upload-artifact@v4
        with:
          name: paceup-web
          path: build/web
          retention-days: 30

      - name: Unggah artifact Pages
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Catatan bila Pages belum aktif
        if: steps.pages.outcome != 'success'
        run: |
          echo "### Pages belum aktif ℹ️" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Versi web tetap diunggah sebagai artifact **paceup-web**." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Untuk menerbitkan ke GitHub Pages, aktifkan sekali di:" >> $GITHUB_STEP_SUMMARY
          echo "**Settings -> Pages -> Source: GitHub Actions**, lalu jalankan" >> $GITHUB_STEP_SUMMARY
          echo "workflow ini lagi." >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Terbitkan ke Pages
    needs: build
    # Dijalankan hanya bila Pages berhasil dikonfigurasi.
    if: needs.build.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
