name: Android APK

# Membangun APK di runner GitHub (gratis), lalu mengunggahnya sebagai artifact.
# Berguna bila mesin lokal tidak punya Android SDK atau ruang disk terbatas.
#
# Cara pakai:
#   1. Push ke branch `main` (atau jalankan manual lewat tab Actions).
#   2. Buka tab Actions -> pilih run terbaru -> unduh artifact
#      "paceup-apk".
#   3. Kirim APK ke ponsel, lalu install (aktifkan "Install dari sumber
#      tidak dikenal").
#
# Catatan: APK release di sini ditandatangani dengan debug key dari
# build.gradle.kts, jadi cocok untuk pengujian pribadi — BUKAN untuk
# Play Store. Untuk rilis nyata, tambahkan keystore via GitHub Secrets.

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'sql/**'
      - 'android/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analisis & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ambil dependensi
        run: flutter pub get

      - name: Analisis statis
        run: flutter analyze

      - name: Jalankan test
        run: flutter test

  build-apk:
    name: Build APK
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ambil dependensi
        run: flutter pub get

      - name: Build APK release
        # Kredensial Supabase opsional. Bila kosong, aplikasi otomatis
        # berjalan di mode demo lokal (login: demo@paceup.app / paceup123).
        # Isi lewat: Settings -> Secrets and variables -> Actions.
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}

      - name: Ganti nama APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             dist/paceup-${{ github.sha }}.apk

      # always(): artefak tetap terunggah walau langkah sebelumnya gagal,
      # sehingga APK yang sudah terbentuk tidak hilang.
      - name: Unggah artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paceup-apk
          path: dist/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Ringkasan
        run: |
          echo "### APK siap diunduh 📱" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Unduh artifact **paceup-apk** di bagian bawah halaman ini," >> $GITHUB_STEP_SUMMARY
          echo "kirim ke ponsel, lalu install." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls -lh dist/ >> $GITHUB_STEP_SUMMARY
